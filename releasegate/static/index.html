<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReleaseGate</title>
<style>
 :root{--bg:#0f1318;--card:#171d25;--line:#2a3340;--tx:#e6ebf2;--mut:#93a0b3;--ok:#3ecf8e;--bad:#ff6b6b;--warn:#f5c04a;--acc:#5aa9ff}
 *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,Segoe UI,sans-serif}
 header{padding:14px 24px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
 h1{font-size:20px;margin:0} .tag{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
 .tag.mock{color:#111;background:var(--warn);border-color:var(--warn);font-weight:700}.tag.sandbox{color:#052;background:var(--ok);border-color:var(--ok);font-weight:700}
 main{display:grid;grid-template-columns:340px 1fr;gap:20px;padding:20px 24px;max-width:1200px;margin:auto}
 @media(max-width:900px){main{grid-template-columns:1fr}}
 .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
 h2{font-size:15px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
 label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
 input,textarea,select{width:100%;background:#0c1015;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit}
 textarea{min-height:110px;resize:vertical}
 button{background:var(--acc);color:#04111f;border:0;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer;margin:8px 8px 0 0}
 button.sec{background:#26303d;color:var(--tx)} button.bad{background:var(--bad)} button:disabled{opacity:.4;cursor:not-allowed}
 .job{padding:8px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
 .job:hover,.job.sel{border-color:var(--acc)} .state{font-size:12px;color:var(--mut)}
 .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700}
 .SUPPORTED,.CAPTURED{background:var(--ok);color:#042}.UNSUPPORTED,.VOIDED{background:var(--bad);color:#300}.NOT_VERIFIED,.HOLD{background:var(--warn);color:#321}
 .info{background:#26303d;color:var(--tx)} table{width:100%;border-collapse:collapse;font-size:13px}
 td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top} th{color:var(--mut);font-weight:600}
 code{font-size:12px;color:var(--mut);word-break:break-all} .big{font-size:20px;font-weight:700} .err{color:var(--bad);margin-top:8px}
 ul.cl{margin:6px 0 0;padding-left:18px}
</style></head><body>
<header><h1>ReleaseGate</h1><span id="mode" class="tag">…</span><span id="ai" class="tag">…</span>
<span style="color:var(--mut)">Pay is authorized up front, captured only when the delivery passes the checks.</span></header>
<main>
 <section>
  <div class="card"><h2>1 · New job</h2>
   <label>Title</label><input id="title" value="Product explainer video">
   <label>Brief (what the client asked for)</label>
   <textarea id="brief">Deliver an 8 second video, at least 720p, with a voiceover. Loudness around -23 LUFS. No black frames.</textarea>
   <label>Amount (sandbox money only)</label><input id="amount" value="25.00">
   <button id="create">Create job</button><div id="cerr" class="err"></div></div>
  <div class="card"><h2>Jobs</h2><div id="jobs"></div></div>
 </section>
 <section id="detail"><div class="card">Create or pick a job.</div></section>
</main>
<script>
const $=id=>document.getElementById(id); let cur=null, err='';
async function api(path,opt){const r=await fetch(path,opt);const j=await r.json();if(!r.ok)throw new Error(j.error||'error');return j}
function el(t,props={},...kids){const e=document.createElement(t);Object.assign(e,props);kids.flat().forEach(k=>e.append(k));return e}
function pill(s){return el('span',{className:'pill '+s,textContent:s.replace('_',' ')})}
async function status(){const s=await api('/api/status');
 $('mode').textContent=s.paypal_mode==='mock'?'MOCK MODE · local testing only · not PayPal':'PayPal SANDBOX';$('mode').className='tag '+s.paypal_mode;
 $('ai').textContent=s.checklist_mode==='ai'?'checklist: AI-assisted ('+s.model+')':'checklist: rule-based'}
async function refreshJobs(){const js=await api('/api/jobs');const box=$('jobs');box.replaceChildren();
 if(!js.length)box.append(el('div',{className:'state',textContent:'No jobs yet.'}));
 js.forEach(j=>box.append(el('div',{className:'job'+(cur===j.id?' sel':''),onclick:()=>open(j.id)},el('span',{textContent:j.title}),el('span',{className:'state',textContent:j.currency+' '+j.amount+' · '+j.state}))))}
async function open(id){cur=id;location.hash=id;await render();refreshJobs()}
async function act(path,body,isUpload){err='';try{await api('/api/jobs/'+cur+'/'+path,body)}catch(e){err=e.message}await render();refreshJobs()}
async function render(){
 if(!cur)return; const j=await api('/api/jobs/'+cur), ev=await api('/api/jobs/'+cur+'/evidence'); const d=$('detail'); d.replaceChildren();
 const head=el('div',{className:'card'},el('div',{className:'big',textContent:j.title}),
  el('div',{},j.currency+' '+j.amount+' · ',pill(j.state)),
  el('div',{className:'state',textContent:'Mode: '+j.paypal_mode+' · checklist source: '+j.checklist_source}));
 head.append(el('h2',{textContent:'Checklist'}));const ul=el('ul',{className:'cl'});j.checklist.forEach(c=>ul.append(el('li',{textContent:c.description+(c.required?'':' (optional)')})));head.append(ul);
 d.append(head);
 const a=el('div',{className:'card'});a.append(el('h2',{textContent:'Actions'}));
 if(j.state==='CREATED')a.append(el('button',{textContent:'2 · Authorize payment (PayPal)',onclick:()=>act('pay',{method:'POST'}).then(()=>0)}));
 if((j.state==='CREATED'||j.state==='AWAITING_APPROVAL')&&j.paypal_mode==='sandbox')a.append(el('button',{className:'sec',textContent:'2b · Authorize with sandbox test card (no buyer login)',onclick:()=>act('paytest',{method:'POST'})}));
 if(j.state==='AWAITING_APPROVAL'){const u=j.paypal.approval_url;a.append(el('div',{textContent:'Order '+j.paypal.order_id+' created. The buyer must approve it.'}));
  if(u)a.append(el('a',{href:u,textContent:'Open buyer approval →',style:'color:var(--acc)'}))}
 if(j.state==='AUTHORIZED'||j.state==='DELIVERED'){
  const f=el('input',{type:'file',accept:'video/*,audio/*'});a.append(el('label',{textContent:'3 · Deliverable'}),f);
  a.append(el('button',{textContent:'Upload',className:'sec',onclick:async()=>{if(!f.files[0])return;err='';try{await fetch('/api/jobs/'+cur+'/upload',{method:'POST',headers:{'X-Filename':f.files[0].name},body:f.files[0]}).then(async r=>{const x=await r.json();if(!r.ok)throw new Error(x.error)})}catch(e){err=e.message}await render();refreshJobs()}}))}
 if(j.state==='DELIVERED'){a.append(el('div',{className:'state',textContent:'File '+j.deliverable.filename+' · sha256 '+j.deliverable.sha256.slice(0,16)+'…'}));
  a.append(el('button',{textContent:'4 · Run checks and settle',onclick:()=>act('check',{method:'POST'})}),el('button',{className:'sec',textContent:'Pre-flight (no settle)',onclick:async()=>{err='';try{const r=await api('/api/jobs/'+cur+'/preflight',{method:'POST'});showPre(r.result)}catch(e){err=e.message;render()}}}))}
 if(j.state==='HOLD'){a.append(el('div',{textContent:'Some required claims could not be verified. A person must decide:'}));const r=el('input',{placeholder:'Reason (logged)'});a.append(r,
   el('button',{textContent:'Capture',onclick:()=>act('settle',{method:'POST',body:JSON.stringify({action:'capture',reason:r.value})})}),
   el('button',{className:'bad',textContent:'Void',onclick:()=>act('settle',{method:'POST',body:JSON.stringify({action:'void',reason:r.value})})}))}
 if(j.state==='CAPTURED')a.append(el('div',{className:'big',textContent:'Payment CAPTURED — '+(j.paypal.capture_id||'')}));
 if(j.state==='VOIDED')a.append(el('div',{className:'big',textContent:'Authorization VOIDED — client not charged'}));
 if(err)a.append(el('div',{className:'err',textContent:err}));d.append(a);
 const e=el('div',{className:'card'});e.append(el('h2',{textContent:'Evidence log'}),el('div',{className:'state',textContent:'Hash chain: '+(ev.chain_ok?'intact':'BROKEN – '+ev.chain_msg)}));
 const t=el('table',{},el('tr',{},...['#','Event','Claim','Status','Measured / expected'].map(h=>el('th',{textContent:h}))));
 ev.entries.forEach(x=>{const m=x.measured?JSON.stringify(x.measured)+(x.expected?' vs '+JSON.stringify(x.expected):''):(x.reason||x.sha256||x.order_id||x.authorization_id||x.capture_id||'');
  t.append(el('tr',{},el('td',{textContent:x.seq}),el('td',{textContent:x.event}),el('td',{textContent:(x.claim||'')+(x.note?' — '+x.note:'')}),el('td',{},x.status?pill(x.status):''),el('td',{},el('code',{textContent:m}))))});
 e.append(t);d.append(e)}
function showPre(r){const d=$('detail');const c=el('div',{className:'card'},el('h2',{textContent:'Pre-flight result (nothing settled)'}),el('div',{className:'big',textContent:'Would '+r.decision+' — '+r.reason}));
 r.findings.forEach(f=>c.append(el('div',{},pill(f.status),' '+f.claim)));d.prepend(c)}
$('create').onclick=async()=>{$('cerr').textContent='';try{const j=await api('/api/jobs',{method:'POST',body:JSON.stringify({title:$('title').value,brief:$('brief').value,amount:$('amount').value})});await open(j.id)}catch(e){$('cerr').textContent=e.message}};
status();refreshJobs();if(location.hash.length>1){cur=location.hash.slice(1);render()}
</script></body></html>
